<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道 · Caminho do Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    oklch(0.965 0.012 85);
    --paper-2:  oklch(0.985 0.008 85);
    --ink:      oklch(0.22 0.012 60);
    --ink-soft: oklch(0.42 0.012 60);
    --muted:    oklch(0.60 0.010 70);
    --line:     oklch(0.86 0.012 80);
    --line-2:   oklch(0.78 0.014 70);
    --shu:      oklch(0.585 0.175 32);
    --shu-soft: oklch(0.585 0.175 32 / 0.12);
    --good:     oklch(0.55 0.10 150);
    --good-bg:  oklch(0.55 0.10 150 / 0.12);
    --bad:      oklch(0.52 0.14 28);
    --bad-bg:   oklch(0.52 0.14 28 / 0.10);
    --accent:   var(--shu);
    --accent-soft: var(--shu-soft);
    --kanji-font: 'Shippori Mincho B1', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(oklch(0.5 0.02 70 / 0.025) 1px, transparent 1px);
    background-size: 4px 4px;
    -webkit-font-smoothing: antialiased;
  }
  .mincho { font-family: 'Shippori Mincho B1', serif; }

  .app { min-height: 100%; display: flex; flex-direction: column; align-items: center; }
  .frame { width: 100%; max-width: 820px; padding: 0 32px; flex: 1; display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 24px 0 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 12px; cursor: pointer; user-select: none; }
  .brand .mark { font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 26px; color: var(--accent); line-height: 1; }
  .brand .name { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .stats { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: right; line-height: 1.05; }
  .stat .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); transition: transform .18s ease; }
  .stat .num.bump { transform: scale(1.35); color: var(--accent); }
  .stat .lab { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .gear-btn { appearance: none; border: 1.5px solid var(--line-2); background: var(--paper-2); color: var(--ink-soft);
    width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; line-height: 1;
    display: grid; place-items: center; transition: transform .15s, border-color .15s, color .15s; }
  .gear-btn:hover { transform: rotate(25deg); border-color: var(--accent); color: var(--accent); }

  /* clock / demo control */
  .clockbar { display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:10px 16px; margin-top:14px; border:1px dashed var(--line-2); border-radius:12px;
    background: var(--paper-2); font-size:13px; color:var(--ink-soft); }
  .clockbar .day { font-weight:700; color:var(--ink); }
  .clockbar .note { color: var(--muted); }
  .mini { font-family:inherit; font-size:12px; font-weight:700; padding:7px 12px; border-radius:9px;
    border:1.5px solid var(--line-2); background:var(--paper); color:var(--ink); cursor:pointer; transition: all .15s; }
  .mini:hover { border-color: var(--ink-soft); transform: translateY(-1px); }

  /* ---------- stage / steps ---------- */
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 22px 0 30px; }
  .step { animation: none; }
  @media (prefers-reduced-motion: no-preference) { .step { animation: stepIn .4s cubic-bezier(.16,1,.3,1); } }
  @keyframes stepIn { from { transform: translateY(14px); } to { transform: translateY(0); } }

  .neuro { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 7px 14px; margin: 0 auto 22px; }
  .neuro .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .neuro.hide { display: none; }

  /* ---------- DASHBOARD ---------- */
  .dash { padding: 24px 0 40px; }
  .dash .hello { font-family:'Shippori Mincho B1',serif; font-size: 34px; font-weight: 800; margin-bottom: 6px; }
  .dash .date { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

  /* focus by level */
  .focus-row { display:flex; align-items:center; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .focus-lbl { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .focus-chips { display:flex; gap:7px; flex-wrap:wrap; }
  .fchip { font-family:inherit; font-size:14px; font-weight:700; color:var(--ink-soft); border:1.5px solid var(--line-2);
    background:var(--paper-2); border-radius:12px; padding:7px 15px 6px; cursor:pointer; transition: all .14s;
    display:flex; flex-direction:column; align-items:center; line-height:1.1; min-width:52px; }
  .fchip small { font-size:10px; font-weight:600; opacity:.62; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .fchip:hover { border-color:var(--ink-soft); transform:translateY(-1px); }
  .fchip.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }

  .queue-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 30px; }
  .qcard { border: 1.5px solid var(--line-2); border-radius: 18px; padding: 22px; background: var(--paper-2);
    display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
  .qcard .big { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .qcard .lab { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .qcard.due .big { color: var(--accent); }
  .qcard.new .big { color: var(--ink); }
  .qcard .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .start-row { display:flex; gap:12px; align-items:center; margin-bottom: 34px; flex-wrap: wrap; }

  /* maturity bar */
  .mat { margin-bottom: 30px; }
  .mat .h { font-size: 12px; letter-spacing:.12em; text-transform:uppercase; color: var(--muted); font-weight:700;
    margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .mat .h::after { content:''; flex:1; height:1px; background:var(--line); }
  .matbar { display:flex; height:14px; border-radius:7px; overflow:hidden; background: var(--line); }
  .matbar i { display:block; height:100%; }
  .matbar .novo   { background: oklch(0.78 0.014 70); }
  .matbar .jovem  { background: oklch(0.66 0.12 60); }
  .matbar .maduro { background: var(--good); }
  .matleg { display:flex; gap:18px; margin-top:10px; font-size:12px; color: var(--ink-soft); flex-wrap:wrap; }
  .matleg span { display:flex; align-items:center; gap:6px; }
  .matleg b { width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* collection grid */
  .coll .h { font-size: 12px; letter-spacing:.12em; text-transform:uppercase; color: var(--muted); font-weight:700;
    margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .coll .h::after { content:''; flex:1; height:1px; background:var(--line); }
  .gridcells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  @media (max-width: 620px){ .gridcells { grid-template-columns: repeat(6, 1fr); } .queue-cards{grid-template-columns:1fr;} }
  .cell { aspect-ratio: 1; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper-2);
    display: grid; place-items: center; font-family:var(--kanji-font); font-size: 26px; font-weight: 700;
    position: relative; cursor: default; transition: transform .15s; }
  .cell:hover { transform: translateY(-2px); }
  .cell.locked { color: var(--line-2); background: transparent; border-style: dashed; }
  .cell.atom { box-shadow: inset 0 0 0 1.5px var(--accent-soft); }
  .cell.support { border-style: dashed; }
  .cell .lvbadge { position:absolute; top:4px; left:5px; font-size:8px; font-weight:800; letter-spacing:.03em;
    color: var(--muted); font-family: 'Zen Kaku Gothic New', sans-serif; }
  .cell .pip { position:absolute; right:5px; bottom:4px; width:7px; height:7px; border-radius:50%; }
  .cell .pip.novo{ background: oklch(0.72 0.014 70);} .cell .pip.jovem{ background: oklch(0.66 0.12 60);} .cell .pip.maduro{ background: var(--good);} 
  .cell .pip.duenow{ background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- LEARN (composição) ---------- */
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .genko { position: relative; width: 196px; height: 196px; border: 1.5px solid var(--line-2);
    background: var(--paper-2); display: grid; place-items: center; box-shadow: 0 2px 0 var(--line); }
  .genko::before, .genko::after { content: ''; position: absolute; }
  .genko::before { left: 50%; top: 8px; bottom: 8px; border-left: 1px dashed var(--line-2); }
  .genko::after  { top: 50%; left: 8px; right: 8px; border-top: 1px dashed var(--line-2); }
  .glyph { font-family:var(--kanji-font); font-weight: 700; font-size: 128px; line-height: 1; color: var(--ink); position: relative; z-index: 1; user-select: none; }
  .glyph.sm { font-size: 78px; }

  .tagrow { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; font-family: 'Zen Kaku Gothic New', sans-serif; }
  .tag-radical { background: var(--accent-soft); color: var(--accent); }
  .tag-kanji { background: var(--paper-2); border: 1px solid var(--line-2); color: var(--muted); }
  .tag-class { background: var(--paper-2); border: 1px solid var(--line-2); color: var(--muted); }

  .meaning { text-align: center; font-family:'Shippori Mincho B1',serif; font-size: 30px; font-weight: 700; margin-bottom: 12px; }
  .readings { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip { font-size: 14px; color: var(--ink-soft); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 14px; background: var(--paper-2); }
  .chip b { color: var(--muted); font-weight: 700; margin-right: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .chip.phon-note { font-size: 11px; font-style: italic; color: var(--muted); background: transparent; border-style: dashed; padding: 6px 10px; cursor: help; }
  .chip.phon-good { font-size: 11px; font-weight: 700; color: oklch(0.42 0.13 75); background: oklch(0.88 0.13 85 / .38); border-color: oklch(0.72 0.15 80); padding: 6px 10px; cursor: help; }
  .chip.phon-good b { color: inherit; margin-right: 4px; }

  /* breakdown: peças → kanji */
  .breakdown { display:flex; align-items:center; justify-content:center; gap:14px; margin: 0 auto 22px; flex-wrap: wrap; }
  .piece { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .piece .pk { font-family:var(--kanji-font); font-size: 40px; font-weight:700; width:64px; height:64px;
    border:1.5px solid var(--line-2); border-radius:12px; background:var(--paper-2); display:grid; place-items:center; }
  .piece .pl { font-size:11px; color: var(--muted); font-weight:600; max-width:70px; text-align:center; line-height:1.2; }
  .op { font-size: 26px; color: var(--muted); font-weight: 300; }
  .op.eq { color: var(--accent); font-weight: 700; }
  .piece.result .pk { border-color: var(--accent); color: var(--accent); }

  .mnemonic { max-width: 500px; margin: 0 auto 28px; text-align: center; font-size: 17px; line-height: 1.65; color: var(--ink-soft); text-wrap: pretty; }
  .mnemonic .lead { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color: var(--muted); font-weight:700; margin-bottom:10px; }
  .mnemonic strong { color: var(--ink); }

  .prompt { text-align:center; font-size:18px; color: var(--ink-soft); margin-bottom: 22px; }
  .prompt b { color: var(--ink); font-weight: 700; }

  /* buttons */
  .actions { display:flex; justify-content:center; gap:12px; margin-top:6px; flex-wrap: wrap; }
  .btn { font-family:inherit; font-size:16px; font-weight:700; padding:14px 28px; border-radius:12px;
    border:1.5px solid var(--line-2); background:var(--paper-2); color:var(--ink); cursor:pointer;
    transition: transform .12s, background .2s, border-color .2s, color .2s; }
  .btn:hover { transform: translateY(-2px); border-color: var(--ink-soft); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn-accent { background: var(--accent); color:#fff; border-color: var(--accent); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity:.4; cursor:default; transform:none; }

  /* SRS grade buttons (review) */
  .grade { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top: 6px; }
  .gbtn { font-family:inherit; cursor:pointer; border-radius:13px; padding:13px 22px; border:1.5px solid var(--line-2);
    background:var(--paper-2); color:var(--ink); text-align:center; transition: all .14s; min-width: 130px; }
  .gbtn:hover { transform: translateY(-2px); }
  .gbtn .gt { font-size:15px; font-weight:700; }
  .gbtn .gi { font-size:12px; margin-top:3px; color: var(--muted); }
  .gbtn.again { border-color: var(--bad); } .gbtn.again:hover{ background: var(--bad-bg); }
  .gbtn.again .gt { color: var(--bad); }
  .gbtn.good { border-color: var(--good); } .gbtn.good:hover{ background: var(--good-bg); }
  .gbtn.good .gt { color: var(--good); }

  /* options (recall multiple choice) */
  .options { display:grid; gap:12px; max-width: 480px; margin: 0 auto; }
  .options.k2m { grid-template-columns: 1fr; }
  .options.m2k { grid-template-columns: 1fr 1fr; }
  .option { font-family:inherit; cursor:pointer; border:1.5px solid var(--line-2); background:var(--paper-2);
    border-radius:14px; padding:15px 20px; font-size:18px; font-weight:500; color:var(--ink); text-align:center;
    transition: transform .12s, border-color .15s, background .15s; }
  .option.k { font-family:var(--kanji-font); font-size:42px; font-weight:700; padding:10px; }
  .option:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink-soft); }
  .option:disabled { cursor:default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); color: var(--good); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .option.dim { opacity:.45; }

  /* reveal box */
  .reveal { max-width: 500px; margin: 0 auto 24px; text-align:center; border:1.5px dashed var(--line-2);
    border-radius:16px; padding:22px; background: var(--paper-2); }
  .reveal.blank { color: var(--muted); font-size:15px; }
  .reveal .big { font-family:'Shippori Mincho B1',serif; font-size:24px; font-weight:700; margin-bottom:8px; }
  .reveal .sub { font-size:15px; line-height:1.55; color: var(--ink-soft); }
  .reveal .rd { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }

  /* session progress */
  .sprog { display:flex; gap:5px; padding: 16px 0 4px; }
  .sseg { height:4px; flex:1; border-radius:2px; background: var(--line); overflow:hidden; }
  .sseg .fill { display:block; height:100%; background: var(--accent); width:0; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .sseg.done .fill { width:100%; } .sseg.active .fill { width:50%; }
  .scount { text-align:center; font-size:12px; color: var(--muted); margin-top:8px; letter-spacing:.04em; }
  .ch-lives { display:flex; gap:8px; justify-content:center; margin:0 auto; }
  .ch-lives .heart { font-size:22px; color: var(--bad); transition: opacity .25s, transform .25s; }
  .ch-lives .heart.lost { opacity:.2; transform:scale(.8); color: var(--muted); }
  .ch-giveup-row { text-align:center; margin-top:18px; }
  .ch-record-flag { text-align:center; font-size:13px; font-weight:700; color: var(--muted); margin:-6px 0 18px; letter-spacing:.03em; }
  .ch-record-flag.new { color: var(--accent); font-size:15px; }

  /* hanko stamp */
  .stamp-layer { position: fixed; inset: 0; display:grid; place-items:center; pointer-events:none; z-index:50; }
  .hanko { font-family:'Shippori Mincho B1',serif; font-weight:800; font-size:46px; color:#fff; width:128px; height:128px;
    display:grid; place-items:center; background: var(--accent); border-radius:18px;
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--accent); animation: stamp .7s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes stamp { 0%{opacity:0; transform:scale(1.8) rotate(-14deg);} 35%{opacity:1;} 55%{transform:scale(.94) rotate(-7deg);}
    80%{transform:scale(1) rotate(-7deg);} 100%{opacity:0; transform:scale(1) rotate(-7deg);} }

  /* session summary */
  .summary { text-align:center; padding: 16px 0 50px; }
  .summary .seal { font-family:'Shippori Mincho B1',serif; font-weight:800; font-size:38px; color:#fff;
    width:104px; height:104px; border-radius:16px; background: var(--accent); display:grid; place-items:center;
    margin:0 auto 20px; box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--accent); transform: rotate(-6deg); }
  .summary h2 { font-family:'Shippori Mincho B1',serif; font-size:32px; font-weight:800; margin-bottom:6px; }
  .summary .sub { color: var(--ink-soft); font-size:15px; margin-bottom:28px; }
  .scorecard { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; max-width:460px; margin:0 auto 30px; }
  .scorecard .s { border:1.5px solid var(--line); border-radius:14px; padding:18px 8px; background: var(--paper-2); }
  .scorecard .s .n { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; color: var(--accent); }
  .scorecard .s .l { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--muted); margin-top:4px; }

  .nextrev { max-width: 480px; margin: 0 auto 30px; text-align:left; }
  .nextrev .rh { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .nextrev .rh::after { content:''; flex:1; height:1px; background:var(--line); }
  .rrow { display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); }
  .rrow .rk { font-family:var(--kanji-font); font-size:28px; font-weight:700; width:38px; text-align:center; }
  .rrow .rm { flex:1; font-size:14px; color: var(--ink-soft); }
  .rrow .rt { font-size:13px; font-weight:700; color: var(--ink); }

  .footnote { text-align:center; font-size:12px; color: var(--muted); padding: 16px 0 28px; line-height:1.6; }
  .footnote .jp { font-family:'Shippori Mincho B1',serif; }

  @media (max-width: 560px){ .frame{ padding:0 18px; } .glyph{ font-size:104px; } .gridcells{ grid-template-columns: repeat(6,1fr);}
    .tabbar{ gap:2px; } .tab{ padding:10px 3px; gap:4px; font-size:12.5px; } .tab .tjp{ font-size:16px; } }

  /* ---------- TAB BAR ---------- */
  .tabbar { display:flex; gap:4px; padding: 14px 0 0; }
  .tab { font-family:inherit; flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:9px;
    padding:12px 10px; font-size:15px; font-weight:700; color:var(--muted); background:transparent;
    border:none; border-bottom:2px solid var(--line); cursor:pointer; transition: color .15s; }
  .tab:hover { color: var(--ink-soft); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .tjp { font-family:'Shippori Mincho B1',serif; font-size:18px; color: var(--accent); }

  /* ---------- CHALLENGE: config ---------- */
  .ch-config { padding: 18px 0 30px; max-width: 560px; margin: 0 auto; width:100%; }
  .ch-hero { text-align:center; margin-bottom: 26px; }
  .ch-mark { font-family:'Shippori Mincho B1',serif; font-size: 34px; font-weight:800; color: var(--accent); margin-bottom:6px; letter-spacing:.05em; }
  .ch-hero h2 { font-family:'Shippori Mincho B1',serif; font-size: 30px; font-weight:800; margin-bottom:10px; }
  .ch-hero p { font-size:15px; line-height:1.6; color: var(--ink-soft); max-width:440px; margin:0 auto; text-wrap:pretty; }
  .cfg-block { margin-bottom: 20px; }
  .cfg-lbl { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .cfg-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .cfg-grid.c3 { grid-template-columns: repeat(3,1fr); }
  .cfg-grid.c2 { grid-template-columns: repeat(2,1fr); }
